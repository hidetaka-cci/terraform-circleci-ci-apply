version: 2.1

functions:
  setup-terraform: github.com/circleci-functions/setup-terraform@v0.4.0
  setup-aws: github.com/circleci-functions/setup-aws@v0.4.0

commands:
  install_circleci_cli:
    steps:
      - run:
          name: Ensure CircleCI CLI is available
          command: |
            # cimg/base の PATH にある circleci は Build Agent のラッパーで、
            # `circleci workflow cancel` は使えない。本物の CLI か確かめてから入れる。
            # setup-aws の OIDC は Agent 側の `circleci run oidc get` を使うため、
            # このステップは setup-aws のあとに置く。
            need_install=1
            if command -v circleci >/dev/null 2>&1 && circleci version 2>/dev/null | grep -Eq '^[0-9]+\.[0-9]+'; then
              echo "CircleCI CLI already installed"
              circleci version
              need_install=0
            fi
            if [ "$need_install" -eq 1 ]; then
              echo "Installing CircleCI CLI (cimg circleci is Build Agent, not CLI)"
              curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
              export PATH="/usr/local/bin:$PATH"
              echo 'export PATH="/usr/local/bin:$PATH"' >> "$BASH_ENV"
              circleci version
            fi
  check_latest_main:
    parameters:
      mode:
        type: enum
        enum: [report, cancel]
    steps:
      - run:
          name: Check whether this commit is the latest on main (<< parameters.mode >>)
          command: bash .circleci/scripts/check-latest-main.sh << parameters.mode >>

jobs:
  plan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - check_latest_main:
          mode: report
      - setup-terraform:
          with:
            version: "1.17.2"
      - setup-aws:
          with:
            configure-credentials: true
            role-arn: arn:aws:iam::992382483259:role/hidetaka-terraform-ci-apply
            region: us-west-2
            role-session-name: circleci-terraform-plan
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run:
          name: terraform plan
          command: |
            terraform plan -input=false -lock-timeout=60s -out=tfplan | tee plan.txt
            echo "==== terraform show tfplan (sanitized check) ===="
            terraform show -no-color tfplan | tee plan-show.txt
      - store_artifacts:
          path: plan.txt
      - store_artifacts:
          path: plan-show.txt
      - persist_to_workspace:
          root: .
          paths: [tfplan]

  apply:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup-terraform:
          with:
            version: "1.17.2"
      # OIDC は Agent の circleci でトークンを取るため、本物 CLI の導入より先に実行する
      - setup-aws:
          with:
            configure-credentials: true
            role-arn: arn:aws:iam::992382483259:role/hidetaka-terraform-ci-apply
            region: us-west-2
            role-session-name: circleci-terraform-apply
      - install_circleci_cli
      - run: terraform init -input=false
      - check_latest_main:
          mode: cancel
      - run:
          name: terraform apply (saved plan)
          command: |
            set +e
            terraform apply -input=false -lock-timeout=60s tfplan 2>&1 | tee apply.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ] && grep -q 'Saved plan is stale' apply.log; then
              echo "plan が古い: この pipeline の plan のあと、別の apply で state が変わった。"
              echo "この pipeline の workflow を「Rerun workflow from start」で再実行して plan を作り直し、改めて hold-apply を承認する。"
            fi
            exit "$code"

workflows:
  terraform:
    jobs:
      - plan:
          context: [terraform-ci-apply]
      - hold-apply:
          type: approval
          requires: [plan]
          filters:
            branches:
              only: main
      - apply:
          context: [terraform-ci-apply]
          requires: [hold-apply]
          filters:
            branches:
              only: main
